services:
  jellyfin:
    image: linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    networks:
      - default
      - trusted_proxy
    volumes:
      - jellyfin-config:/config
      - /mnt/ehdd/Videos/Shows:/data/tvshows
      - /mnt/ehdd/Videos/Movies:/data/movies
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Africa/Cairo
    networks:
      - default
      - untrusted_proxy
    volumes:
      - jellyseerr-config:/app/config
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    networks:
      - default
      - untrusted_proxy
    volumes:
      - prowlarr-config:/config
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    networks:
      - default
      - untrusted_proxy
    volumes:
      - qbittorrent-config:/config
      - qbittorrent-downloads:/downloads
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    networks:
      - default
      - untrusted_proxy
    volumes:
      - sonarr-config:/config
      - /mnt/ehdd/Videos/Shows:/tv
      - qbittorrent-downloads:/downloads
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    networks:
      - default
      - untrusted_proxy
    volumes:
      - radarr-config:/config
      - /mnt/ehdd/Videos/Movies:/movies
      - qbittorrent-downloads:/downloads
    restart: unless-stopped

networks:
  trusted_proxy:
    external: true
  untrusted_proxy:
    external: true

volumes:
  jellyfin-config:
  jellyseerr-config:
  prowlarr-config:
  qbittorrent-config:
  qbittorrent-downloads:
  sonarr-config:
  radarr-config:
