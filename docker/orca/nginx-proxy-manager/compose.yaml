services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx_proxy_manager-main
    restart: unless-stopped
    networks:
      - trusted_proxy
      - untrusted_proxy
    ports:
      - '81:81'
      - '443:443'
    volumes:
      - data:/data
      - letsencrypt:/etc/letsencrypt

  npm-sync:
    image: ghcr.io/toyonix/npm-sync:latest
    restart: unless-stopped
    networks:
      - trusted_proxy
    volumes:
      - ./.sync-config.yaml:/config/config.yaml:ro

networks:
  trusted_proxy:
    external: true
  untrusted_proxy:
    external: true

volumes:
  data:
  letsencrypt:
