services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome-main
    restart: unless-stopped
    networks:
      - trusted_proxy
    ports:
      - '80:80/tcp'            # Interface
      - '53:53/udp'            # DNS
      - '53:53/tcp'            # DNS TCP
      - '853:853/tcp'          # DoT
      - '67:67/udp'            # DHCP server
      - '68:68/udp'            # DHCP client
    volumes:
      - work:/opt/adguardhome/work
      - conf:/opt/adguardhome/conf
  adguardhome-sync:
    image: ghcr.io/bakito/adguardhome-sync
    container_name: adguardhome-sync
    command: run --config /config/adguardhome-sync.yaml
    restart: unless-stopped
    networks:
      - trusted_proxy
    volumes:
      - ./sync-config.yaml:/config/adguardhome-sync.yaml

networks:
  trusted_proxy:
    external: true

volumes:
  work:
  conf:


